# Минимальный конфиг Tempo для локального стенда: принимает трейсы по
# OTLP (и backend, и recommendations шлют сюда через otlptracehttp),
# хранит их на локальном диске. Никакой репликации/кластера — это локальный стенд,
# не production.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
