# Gateway — единая точка входа. Проксирует статику фронтенда и /api/* на
# backend. Генерирует X-Request-ID, если его ещё нет — тот самый
# correlation ID, который сохраняется в логах и трейсах.

log_format gateway_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id_out",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time_ms":$request_time,'
    '"upstream":"$upstream_addr"'
  '}';

map $http_x_request_id $request_id_out {
  ""      $request_id;   # nginx 1.11+ has $request_id built-in (random hex)
  default $http_x_request_id;
}

server {
  listen 80;
  server_name _;

  access_log /dev/stdout gateway_json;

  # ── API → backend ──────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:8081/api/;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
  }

  # Учебная админ-панель: наружу отдаём только три явно разрешённые ручки,
  # а не весь /admin внутренних сервисов.
  location = /lab-admin/recommendations-policy {
    proxy_pass http://backend:8081/admin/recommendations-policy;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location = /lab-admin/recommendations-chaos {
    proxy_pass http://recommendations:8082/admin/chaos;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location = /lab-admin/payment-chaos {
    proxy_pass http://payment:8083/admin/chaos;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location = /lab-admin/resilience {
    proxy_pass http://backend:8081/admin/resilience;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location = /lab-admin/stock {
    proxy_pass http://backend:8081/admin/stock;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
  location ~ ^/lab-admin/products/([0-9]+)/restock$ {
    proxy_pass http://backend:8081/admin/products/$1/restock;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }

  # Браузер экспортирует корневой span пользовательского действия сюда.
  # Проксируем на OTel Collector, который видит client-спаны frontend и
  # строит service graph (~ребро frontend->backend), а дальше сам экспортирует
  # трейсы в Tempo. Снаружи порт 4318 браузеру не нужен.
  location = /v1/traces {
    proxy_pass http://otel-collector:4318/v1/traces;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }

  # ── Всё остальное → статика фронтенда ──────────────────────────────
  location / {
    proxy_pass http://frontend:80/;
    proxy_set_header X-Request-ID $request_id_out;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }
}