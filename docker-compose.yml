version: "3.9"

services:

  # ── Точка входа ──────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    container_name: sre-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks: [sre-lab]

  # ── 1. Frontend (React витрина) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: sre-frontend
    networks: [sre-lab]

  # ── 2. Backend API (Go) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: sre-backend
    environment:
      SERVICE_NAME: backend
      HTTP_ADDR: ":8081"
      DATABASE_URL: "postgres://sre:sre@postgres:5432/store?sslmode=disable"
      RECOMMENDATIONS_URL: "http://recommendations:8082"
      PAYMENT_URL: "http://payment:8083"
      RECOMMENDATIONS_FAILURE_MODE: "strict"
      OTLP_ENDPOINT: "otel-collector:4318"
      LOG_LEVEL: "info"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      recommendations:
        condition: service_started
      payment:
        condition: service_started
    networks: [sre-lab]

  # ── 4. Recommendations (Go, "хрупкая" зависимость для circuit breaker) ─
  recommendations:
    build:
      context: ./recommendations
    container_name: sre-recommendations
    environment:
      SERVICE_NAME: recommendations
      HTTP_ADDR: ":8082"
      OTLP_ENDPOINT: "otel-collector:4318"
      LOG_LEVEL: "info"
      CHAOS_FAIL_RATE: "0"
      CHAOS_LATENCY_MS: "0"
      RATE_LIMIT_RPS: "0"       # 0 = лимитер выключен
      RATE_LIMIT_BURST: "1"
    ports:
      - "8082:8082"
    networks: [sre-lab]

  # ── 4b. Payment (Go, оплата заказа — вторая "хрупкая" зависимость) ────
  payment:
    build:
      context: ./payment
    container_name: sre-payment
    environment:
      SERVICE_NAME: payment
      HTTP_ADDR: ":8083"
      DATABASE_URL: "postgres://sre:sre@postgres:5432/store?sslmode=disable"
      OTLP_ENDPOINT: "otel-collector:4318"
      LOG_LEVEL: "info"
      CHAOS_FAIL_RATE: "0"
      CHAOS_LATENCY_MS: "0"
      CHAOS_STAGE: "bank"
      CHAOS_FAIL_KIND: "card_declined"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sre-lab]

  # ── 3. Postgres ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sre-postgres
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: store
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d store"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sre-lab]

  # ── 6. VictoriaMetrics (хранилище метрик, Prometheus-совместимое) ────
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: sre-victoriametrics
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/vm/scrape.yml"
      - "--selfScrapeInterval=10s"
    volumes:
      - ./victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
      - vmdata:/storage
    ports:
      - "8428:8428"   # UI/API VictoriaMetrics (vmui, /targets)
    networks: [sre-lab]

  # ── 6b. vmalert: выполняет алерты по метрикам против VictoriaMetrics ──
  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: sre-vmalert
    command:
      - "-rule=/etc/vmalert/alerts.yml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-notifier.url=http://alertmanager:9093"
      - "-httpListenAddr=:8880"
      - "-evaluationInterval=5s"
    volumes:
      - ./vmalert/alerts.yml:/etc/vmalert/alerts.yml:ro
    ports:
      - "8880:8880"   # UI vmalert (+ /api/v1/rules, /-/rules)
    depends_on:
      - victoriametrics
      - alertmanager
    networks: [sre-lab]

  # ── 6c. Alertmanager: дедупликация/маршрутизация уведомлений ────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sre-alertmanager
    user: "0:0"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/data"
      - "--web.listen-address=:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/template.tmpl:/etc/alertmanager/template.tmpl:ro
      - amdata:/data
    ports:
      - "9093:9093"   # UI/API Alertmanager
    depends_on:
      alertreceiver:
        condition: service_started
      mailpit:
        condition: service_healthy
    networks: [sre-lab]

  # ── 6d. alertreceiver: печатает уведомления в stdout (для стенда) ────
  alertreceiver:
    build:
      context: ./alertreceiver
    container_name: sre-alertreceiver
    environment:
      SERVICE_NAME: alertreceiver
      HTTP_ADDR: ":9119"
    networks: [sre-lab]

  # ── 6e. Mailpit: тестовый SMTP-сервер, ловит письма и показывает их в UI.
  # SMTP: mailpit:1025 (нужен Alertmanager), UI: http://localhost:8025 ─────
  mailpit:
    image: axllent/mailpit:latest
    container_name: sre-mailpit
    ports:
      - "8025:8025"    # UI просмотра писем
      # 1025 (SMTP) наружу не публикуем — хватает внутренней сети sre-lab
    healthcheck:
      # Встроенная проверка Mailpit: подключается к /readyz и завершается
      # кодом 0 при доступном сервисе (внутри docker сам определяет порт).
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sre-lab]

  # ── 8. VictoriaLogs (хранилище логов) ────────────────────────────────
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: sre-victorialogs
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:9428"
    volumes:
      - vldata:/storage
    ports:
      - "9428:9428"
    networks: [sre-lab]

  # ── Vector — собирает stdout всех контейнеров и шлёт в VictoriaLogs ──
  vector:
    image: timberio/vector:latest-alpine
    container_name: sre-vector
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      - victorialogs
    networks: [sre-lab]

  # ── 7. Tempo (хранилище трейсов) ─────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: sre-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Tempo API (используется Grafana)
      # Внешние OTLP-порты вынесены на гостевые (3117/3118), потому что
      # 4317/4318 теперь заняты OTel Collector, который принимает трафик от
      # приложений и забирает трейсы у Tempo внутрь сети. Внутренние порты
      # 4317/4318 у Tempo остаются для коллектора.
      - "3117:4317"   # OTLP gRPC (гостевой; внутренний — для коллектора)
      - "3118:4318"   # OTLP HTTP (гостевой; внутренний — для коллектора)
    networks: [sre-lab]

  # ── 7b. OTel Collector: приём OTLP от приложений → экспорт трейсов в
  # Tempo + генерация service graph в VictoriaMetrics ────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sre-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — сюда шлют трейсы приложения
      - "4318:4318"   # OTLP HTTP — сюда шлют трейсы приложения
    depends_on:
      - tempo
      - victoriametrics
    networks: [sre-lab]

  # ── 5. Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sre-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: "victoriametrics-metrics-datasource,victoriametrics-logs-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "victoriametrics-metrics-datasource,victoriametrics-logs-datasource"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics
      - victorialogs
      - tempo
    networks: [sre-lab]

networks:
  sre-lab:
    driver: bridge

volumes:
  pgdata:
  vmdata:
  vldata:
  tempodata:
  grafanadata:
  amdata:
