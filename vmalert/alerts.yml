# Конфиг алертов для vmalert.
#
# vmalert периодически выполняет эти PromQL-выражения против VictoriaMetrics
# (--datasource.url) и, если выражение вернуло непустой результат дольше
# `for`, переводит алерт в состояние firing и отправляет уведомление в
# Alertmanager (--notifier.url).
#
# Примеры намеренно охватывают разные уровни SRE-наблюдаемости:
#   - RED (доступность целей, частота ошибок, задержка p95);
#   - паттерны отказоустойчивости (circuit breaker, retry, bulkhead);
#   - бизнес-метрики стенда (склад, пользователи, отзывы).

groups:
  # ── Доступность экземпляров (Uptime) ─────────────────────────────────
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
          availability: Critical
        annotations:
          title: "Экземпляр {{ $labels.job }} недоступен"
          description: "Скрейпер длительно не может получить /metrics у {{ $labels.job }}. Сервис может быть остановлен или не отвечает."

      # Валидируем, что алерт пишется по недоступности ВСЕХ трёх сервисов;
      # удобно для демонстрации "падающей цели" на /targets.
      - alert: BackendScrapeFailing
        expr: up{job="backend"} == 0
        for: 15s
        labels:
          severity: warning
          availability: Low
        annotations:
          title: "Backend не скрейпится"
          description: "VictoriaMetrics не получает метрики от backend уже больше 15 секунд."

  # ── RED: частота ошибок (Errors) по статусу != 2xx ───────────────────
  - name: red-errors
    rules:
      - alert: HighErrorRate
        # Статус у http_requests_total — текстовый (http.StatusText), поэтому
        # считаем ошибкой всё, что не начинается на "2" (200, 200 OK и т.п.).
        expr: |
          sum(rate(backend_http_requests_total{status!~"2.*"}[5m])) /
          sum(rate(backend_http_requests_total[5m])) > 0.15
        for: 2m
        labels:
          severity: critical
          service: backend
          availability: High
        annotations:
          title: "Backend: доля ошибок высокая"
          description: "Доля не-2xx ответов backend за 5 минут превысила 15% (текущая: {{ $value }})."

      - alert: HighErrorRatePayment
        expr: |
          sum(rate(payment_http_requests_total{status!~"2.*"}[5m])) /
          sum(rate(payment_http_requests_total[5m])) > 0.15
        for: 2m
        labels:
          severity: warning
          service: payment
          availability: Medium
        annotations:
          title: "Payment: доля ошибок высокая"
          description: "Доля не-2xx ответов payment за 5 минут превысила 15% (текущая: {{ $value }})."

      - alert: HighErrorRateRecommendations
        expr: |
          sum(rate(recommendations_http_requests_total{status!~"2.*"}[5m])) /
          sum(rate(recommendations_http_requests_total[5m])) > 0.15
        for: 2m
        labels:
          severity: warning
          service: recommendations
          availability: Medium
        annotations:
          title: "Recommendations: доля ошибок высокая"
          description: "Доля не-2xx ответов recommendations за 5 минут превысила 15% (текущая: {{ $value }})."

  # ── RED: задержка (Duration) — смотрим p95, как учит RED ────────────
  - name: red-duration
    rules:
      - alert: HighLatencyBackend
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(backend_http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 2m
        labels:
          severity: warning
          service: backend
          availability: Medium
        annotations:
          title: "Backend: p95 задержка > 1 c"
          description: "За последние 5 минут p95 задержки ответа backend превысила 1 секунду (p95 = {{ $value }}s). Проверяем БД и внешние зависимости."

      - alert: HighLatencyRecommendations
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(recommendations_http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 2m
        labels:
          severity: warning
          service: recommendations
          availability: Medium
        annotations:
          title: "Recommendations: p95 задержка > 1 c"
          description: "p95 задержки recommendations превысила 1 секунду — похоже на rate limit или перегрузку."

  # ── Паттерны отказоустойчивости ─────────────────────────────────────
  - name: resilience
    rules:
      - alert: CircuitBreakerOpen
        expr: backend_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
          service: backend
          availability: High
        annotations:
          title: "Circuit breaker разомкнут"
          description: "Circuit breaker до recommendations открыт >1 мин — трафик к этой зависимости сейчас не идёт (state=2 open)."

      - alert: RetriesExhausted
        expr: increase(backend_resilience_retry_exhausted_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
          service: backend
          availability: Medium
        annotations:
          title: "Исчерпаны ретраи к {{ $labels.dependency }}"
          description: "За 5 минут ретраи к зависимости {{ $labels.dependency }} исчерпаны более 5 раз."

      - alert: ManyBulkheadRejections
        expr: increase(backend_resilience_bulkhead_rejections_total[5m]) > 20
        for: 1m
        labels:
          severity: warning
          service: backend
          availability: Medium
        annotations:
          title: "Bulkhead активно отклоняет запросы"
          description: "Перегородка за 5 минут отклонила {{ $value }} запросов к {{ $labels.dependency }} — пул ресурсов исчерпан."

  # ── Бизнес-метрики стенда ────────────────────────────────────────────
  - name: business
    rules:
      - alert: LowStockProducts
        expr: backend_low_stock_products > 0
        for: 5m
        labels:
          severity: warning
          service: backend
          availability: Low
        annotations:
          title: "Товары закончились на складе"
          description: "Число товаров с нулевым остатком = {{ $value }} уже 5 минут. Требуется restock через админ-панель."

      - alert: HighOutOfStockRate
        expr: increase(backend_out_of_stock_events_total[10m]) > 3
        for: 2m
        labels:
          severity: warning
          service: backend
          availability: Medium
        annotations:
          title: "Партия товаров ушла в 'нет в наличии'"
          description: "За 10 минут более {{ $value }} товаров перешли в состояние 'нет в наличии'."

      - alert: TooManyValidationRejectedReviews
        expr: backend_reviews_rejected_total / clamp_min(backend_reviews_posted_total, 1) > 0.5
        for: 5m
        labels:
          severity: warning
          service: backend
          availability: Low
        annotations:
          title: "Много отзывов отклоняется валидацией"
          description: "Отношение отклонённых отзывов к опубликованным > 0.5 — вероятно, сломан фронт или валидация."

  # ── Резервные / демонстрационные алерты───────────────────────────────
  - name: rate-limiting
    rules:
      - alert: RecommendationsRateLimited
        expr: |
          increase(recommendations_rate_limit_rejections_total[5m]) > 0
            and on() recommendations_rate_limit_requests_per_second > 0
        for: 1m
        labels:
          severity: warning
          service: recommendations
          availability: Medium
        annotations:
          title: "Recommendations отклоняет запросы лимитером"
          description: "Rate limiter recommendations сработал: {{ $value }} отказов за 5 минут (rps лимита > 0)."